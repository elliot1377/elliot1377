<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0418"/>
      <stop offset="0.65" stop-color="#1a0630"/>
      <stop offset="1" stop-color="#2a0a3a"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="300" rx="14"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
      .g1 { animation: g1 3.2s steps(1) infinite; }
      .g2 { animation: g2 3.2s steps(1) infinite; }
      @keyframes g1 { 0%,88%,100% { transform: translate(0,0); opacity: .0; } 90% { transform: translate(-6px,2px); opacity: .9; } 93% { transform: translate(4px,-3px); opacity: .9; } 96% { transform: translate(-2px,0); opacity: .7; } }
      @keyframes g2 { 0%,88%,100% { transform: translate(0,0); opacity: .0; } 90% { transform: translate(6px,-2px); opacity: .9; } 93% { transform: translate(-4px,3px); opacity: .9; } 96% { transform: translate(3px,1px); opacity: .7; } }
      .grid { animation: run 1.6s linear infinite; }
      @keyframes run { from { transform: translateY(0); } to { transform: translateY(24px); } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- skyline -->
    <g fill="#12051f" stroke="#ff2bd6" stroke-opacity="0.25">
      <path d="M640 200V120h40v-30h26v30h30v80M760 200V70h34v-20h18v20h22v130M860 200V110h50v90M930 200V60h28v-24h10v24h30v140M1020 200V100h44v100M1080 200V80h36v120M1130 200V130h70v70"/>
    </g>
    <g fill="#00f0ff" opacity="0.55">
      <rect x="772" y="90" width="4" height="4"/><rect x="784" y="110" width="4" height="4"/><rect x="772" y="140" width="4" height="4"/>
      <rect x="944" y="80" width="4" height="4"/><rect x="964" y="100" width="4" height="4"/><rect x="944" y="130" width="4" height="4"/>
      <rect x="1092" y="100" width="4" height="4"/><rect x="1100" y="140" width="4" height="4"/>
    </g>
    <g fill="#ff2bd6" opacity="0.6">
      <rect x="656" y="140" width="4" height="4"/><rect x="876" y="130" width="4" height="4"/><rect x="1036" y="120" width="4" height="4"/><rect x="1150" y="150" width="4" height="4"/>
    </g>

    <!-- floor grid -->
    <rect y="140" width="1200" height="60" fill="url(#horizon)"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#ff2bd6" stroke-width="2" filter="url(#glow)"/>
    <g stroke="#ff2bd6" stroke-opacity="0.45">
      <g class="grid">
        <line x1="0" y1="206" x2="1200" y2="206"/><line x1="0" y1="218" x2="1200" y2="218"/>
        <line x1="0" y1="236" x2="1200" y2="236"/><line x1="0" y1="262" x2="1200" y2="262"/>
        <line x1="0" y1="296" x2="1200" y2="296"/>
      </g>
      <path d="M600 200L-600 300M600 200L-200 300M600 200L200 300M600 200L450 300M600 200L600 300M600 200L750 300M600 200L1000 300M600 200L1400 300M600 200L1800 300"/>
    </g>
    <rect y="200" width="1200" height="100" fill="#0a0418" opacity="0.35"/>

    <!-- text -->
    <text x="64" y="70" class="mono" font-size="15" fill="#00f0ff" letter-spacing="3">// NEON_GRID.NET :: USER elliot1377 :: ONLINE<tspan class="blink">█</tspan></text>

    <g font-size="96" font-weight="900" letter-spacing="4">
      <text class="g1" x="60" y="160" fill="#00f0ff">ELLIOT</text>
      <text class="g2" x="60" y="160" fill="#ff2bd6">ELLIOT</text>
      <text x="60" y="160" fill="#fdf6ff" filter="url(#glow)">ELLIOT</text>
    </g>

    <rect x="64" y="180" width="350" height="30" fill="#fcee0a"/>
    <text x="76" y="201" class="mono" font-size="15" font-weight="700" fill="#0a0418" letter-spacing="2">COD REVIVAL // EMULATION // RE</text>

    <g class="mono" font-size="12" font-weight="700" letter-spacing="2">
      <text x="64" y="250" fill="#ff2bd6">[XBOX 360]</text>
      <text x="164" y="250" fill="#00f0ff">[PS3]</text>
      <text x="224" y="250" fill="#fcee0a">[PS5]</text>
    </g>
  </g>
</svg>
