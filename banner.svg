<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset="1" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cff6b"/>
      <stop offset="1" stop-color="#2bd4a8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07090d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#07090d" stop-opacity="0"/>
      <stop offset="1" stop-color="#07090d" stop-opacity="0.9"/>
    </linearGradient>
    <style>
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(300px); } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: Consolas, 'SFMono-Regular', Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="14" fill="url(#grid)"/>

  <!-- crosshair motif -->
  <g transform="translate(1010 140)" stroke="#7cff6b" stroke-opacity="0.22" fill="none">
    <circle r="92" stroke-width="1.5"/>
    <circle r="58" stroke-width="1" stroke-dasharray="4 7"/>
    <path d="M-130 0H-22M22 0H130M0 -130V-22M0 22V130" stroke-width="1.5"/>
    <circle r="3" fill="#7cff6b" fill-opacity="0.6" stroke="none"/>
  </g>
  <rect width="1200" height="280" rx="14" fill="url(#fade)" opacity="0.35"/>

  <!-- scanline -->
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#7cff6b" opacity="0.08"/>

  <!-- text -->
  <text x="72" y="92" class="mono" font-size="16" fill="#7cff6b" letter-spacing="3">&gt; CONNECTING TO ONLINE SERVICES<tspan class="blink">_</tspan></text>
  <text x="68" y="168" font-size="84" font-weight="800" fill="#f3f6f8" letter-spacing="2">elliot</text>
  <rect x="72" y="188" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="72" y="228" font-size="21" fill="#9aa7b4">Reviving classic Call of Duty  ·  Emulation  ·  Reverse engineering</text>

  <!-- platform tags -->
  <g class="mono" font-size="13" letter-spacing="2" font-weight="700" transform="translate(-140 0)">
    <rect x="760" y="44" width="96" height="28" rx="5" fill="none" stroke="#107c10" stroke-width="1.5"/>
    <text x="808" y="63" text-anchor="middle" fill="#55c24f">XBOX 360</text>
    <rect x="866" y="44" width="58" height="28" rx="5" fill="none" stroke="#3a6fd8" stroke-width="1.5"/>
    <text x="895" y="63" text-anchor="middle" fill="#7aa2ff">PS3</text>
    <rect x="934" y="44" width="58" height="28" rx="5" fill="none" stroke="#9aa7b4" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="963" y="63" text-anchor="middle" fill="#c9d1d9">PS5</text>
  </g>
</svg>
